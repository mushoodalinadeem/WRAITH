<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WRAITH — Operator Login</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
</head>
<body class="login-body">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <main class="login-card">
    <div class="login-brand">[ WRAITH ]</div>
    <p class="login-sub">OPERATOR CONSOLE</p>
    <p class="login-error" id="login-error">__LOGIN_ERROR__</p>
    <form method="post" action="/dashboard/login" autocomplete="off">
      <input type="hidden" name="csrf_token" value="__CSRF_TOKEN__" />
      <label for="username">USERNAME</label>
      <input id="username" name="username" type="text" required autofocus />
      <label for="password">PASSWORD</label>
      <input id="password" name="password" type="password" required />
      <button type="submit">AUTHENTICATE</button>
    </form>
  </main>
  <script>
    (function () {
      var el = document.getElementById("login-error");
      if (el && !el.textContent.trim()) el.style.display = "none";
    })();
  </script>
</body>
</html>
